services:
  # FastAPI Backend
  - type: web
    name: digital-banking-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: digital-banking-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          name: digital-banking-redis
          type: redis
          property: connectionString
    healthCheckPath: /health

databases:
  - name: digital-banking-db
    databaseName: digital_banking
    user: digital_banking_user
    plan: free

  - name: digital-banking-redis
    plan: free
```

---

### **3. Create `.env.example` in backend root**
```
# Database
DATABASE_URL=postgresql://user:password@localhost/digital_banking

# Security
SECRET_KEY=your-secret-key-here-generate-a-random-string

# Redis
REDIS_URL=redis://localhost:6379

# Environment
ENVIRONMENT=production